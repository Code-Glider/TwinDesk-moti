name: Build macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the files on (e.g. v2.0.1; made as a draft if it isn't there). Empty = run artifacts only.
        required: false
        default: ''
      ref:
        description: Branch to build (a test branch; releases come from main).
        required: false
        default: main

# Build/test branches never need a write token. The publish job gets write only after build success.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      source_sha: ${{ steps.source_sha.outputs.sha }}
    # Branch test builds may run repository-controlled scripts, so never supply signing secrets
    # to them. Only the default-branch workflow building main may access release credentials.
    env:
      TRUSTED_MAIN: ${{ (inputs.ref || 'main') == 'main' && github.ref == 'refs/heads/main' }}

    steps:
      # Fail before checkout/installation when a tagged release requests arbitrary branch code.
      - name: Verify tagged release source
        if: inputs.tag != ''
        env:
          RELEASE_SOURCE_REF: ${{ inputs.ref || 'main' }}
        run: |
          if [ "$RELEASE_SOURCE_REF" != main ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Tagged macOS releases must build main from the main workflow ref.'
            exit 1
          fi

      # main unless another branch is asked for (ref), whichever branch the run was started from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: Record exact build source commit
        id: source_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/android-full
        with:
          keystore: ${{ env.TRUSTED_MAIN == 'true' && secrets.ANDROID_KEYSTORE || '' }}

      - name: Configure Developer ID certificate (if secret provided)
        if: env.TRUSTED_MAIN == 'true'
        id: signing-setup
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/twindesk-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            CERT_PATH="${RUNNER_TEMP}/certificate.p12"

            echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            existing_keychains=()
            while IFS= read -r kc; do
              existing_keychains+=("${kc//\"/}")
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

            security import "$CERT_PATH" \
              -k "$KEYCHAIN_PATH" \
              -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s \
              -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH"

            ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ && !id {id=$2} END {print id}')"
            rm -f "$CERT_PATH"
            if [ -n "$ID" ]; then
              echo "MAC_IDENTITY=$ID" >> "$GITHUB_ENV"
              echo 'TWIN_DESK_DEVELOPER_ID_READY=1' >> "$GITHUB_ENV"
              echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
              echo "Configured Developer ID signing identity: $ID"
            fi
          fi

      - name: Check release credentials and report signing status
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_REF: ${{ inputs.ref || 'main' }}
          APPLE_ID: ${{ env.TRUSTED_MAIN == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.TRUSTED_MAIN == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.TRUSTED_MAIN == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: sh mac/scripts/release-guard.sh

      - name: Install dependencies
        working-directory: mac
        run: npm install

      - name: Build macOS app and disk image
        working-directory: mac
        # Camera › Virtual camera's extension (build-app.sh) only with the two provisioning profiles
        # that allow system extensions (base64 secrets); without them the app is built without it.
        run: |
          if [ -n "$MAC_APP_PROFILE_BASE64" ] && [ -n "$MAC_CAMERA_PROFILE_BASE64" ]; then
            echo "$MAC_APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
            echo "$MAC_CAMERA_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/camera.provisionprofile"
            export MAC_APP_PROFILE="$RUNNER_TEMP/app.provisionprofile" MAC_CAMERA_PROFILE="$RUNNER_TEMP/camera.provisionprofile"
          fi
          npm run dist
          npm run dmg
        env:
          MAC_APP_PROFILE_BASE64: ${{ env.TRUSTED_MAIN == 'true' && secrets.MAC_APP_PROFILE_BASE64 || '' }}
          MAC_CAMERA_PROFILE_BASE64: ${{ env.TRUSTED_MAIN == 'true' && secrets.MAC_CAMERA_PROFILE_BASE64 || '' }}
          MAC_IDENTITY: ${{ env.TRUSTED_MAIN == 'true' && (env.MAC_IDENTITY || secrets.MAC_IDENTITY) || '' }}
          APPLE_ID: ${{ env.TRUSTED_MAIN == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.TRUSTED_MAIN == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.TRUSTED_MAIN == 'true' && secrets.APPLE_TEAM_ID || '' }}

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [ -n "$SIGNING_KEYCHAIN_PATH" ] && [ -f "$SIGNING_KEYCHAIN_PATH" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-macos-dmg
          path: mac/dist/*.dmg
          if-no-files-found: error

  publish:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: twindesk-macos-dmg
          path: dist

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::No verified build source commit to tag.'
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" dist/*.dmg --clobber
